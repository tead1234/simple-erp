<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>견적서</title>
  <style>
    @page { size: A4 portrait; margin: 12mm 14mm 16mm 14mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }

    body { background-color: #f8fafc; padding: 40px 20px; display: flex; justify-content: center; color: #334155; }

    .print-btn {
      position: fixed; top: 12px; right: 12px;
      padding: 8px 18px; background: #7c3aed; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 13px; z-index: 999;
    }
    @media print { .print-btn { display: none; } }

    .invoice-container {
      width: 840px; min-height: 1188px; background-color: #ffffff;
      padding: 50px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border-radius: 8px; position: relative;
    }

    .invoice-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 40px; border-bottom: 4px solid #000000; padding-bottom: 20px;
    }
    .title-area h1 { font-size: 28px; color: #000000; letter-spacing: 2px; margin-bottom: 8px; }
    .title-area p { font-size: 13px; color: #64748b; }
    .meta-info { text-align: right; font-size: 13px; color: #475569; line-height: 1.6; }

    .party-section { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 35px; }
    .client-side { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 5px; }
    .client-name { font-size: 20px; font-weight: 700; border-bottom: 4px solid #64748b; padding-bottom: 8px; margin-bottom: 10px; }
    .client-text { font-size: 14px; color: #475569; }

    .supplier-side { width: 480px; }
    .supplier-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    .supplier-table th {
      background-color: #f1f5f9; color: #000000; font-weight: 600;
      text-align: center; padding: 8px; border: 2px solid #cbd5e1;
    }
    .supplier-table td { padding: 8px; border: 2px solid #cbd5e1; color: #334155; word-break: keep-all; }
    .bank-red { color: #cc0000; font-weight: bold; font-size: 14px; }

    .total-amount-bar {
      background-color: #f1f5f9; border: 2px solid #cbd5e1; padding: 15px 20px;
      border-radius: 6px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px;
    }
    .total-label { font-size: 14px; font-weight: 600; color: #000000; }
    .total-value { font-size: 20px; font-weight: 700; color: #000000; }

    .section-title { font-size: 15px; font-weight: 700; color: #000000; margin-bottom: 10px; }

    .item-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 13px; }
    .item-table th { background-color: #000000; color: #ffffff; font-weight: 500; padding: 12px 10px; border: 2px solid #000000; }
    .item-table td { padding: 10px 10px; border-bottom: 2px solid #e2e8f0; color: #334155; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .item-table tbody tr:hover { background-color: #f8fafc; }

    .summary-row td { font-weight: 600; background-color: #f8fafc; border-bottom: 2px solid #cbd5e1; }
    .summary-row .label { text-align: right; color: #475569; }

    .terms-section { display: flex; gap: 20px; margin-top: 20px; }
    .terms-box { flex: 1; border: 2px solid #e2e8f0; border-radius: 6px; padding: 15px; background-color: #f8fafc; }
    .terms-box ul { list-style: none; font-size: 12px; color: #64748b; line-height: 1.8; }
    .terms-box li span { font-weight: 600; color: #475569; display: inline-block; width: 70px; }

    .memo-box {
      margin-top: 20px; border: 2px solid #e2e8f0; border-radius: 6px;
      padding: 15px; background-color: #f8fafc; min-height: 55px;
      font-size: 12px; color: #475569; white-space: pre-wrap;
    }

    @media print {
      body { background-color: #ffffff; padding: 0; }
      .invoice-container { box-shadow: none; padding: 0; width: 100%; }
    }
  </style>
</head>
<body>
<button class="print-btn" onclick="window.print()">🖨️ 인쇄</button>
<div class="invoice-container" id="doc"><p style="padding:30px;color:#888">데이터를 불러오는 중...</p></div>

<script>
const id = new URLSearchParams(location.search).get('id');
if (!id) {
  document.getElementById('doc').innerHTML = '<p style="padding:20px;color:red">URL에 견적서 ID가 없습니다. (?id=숫자)</p>';
} else {
  Promise.all([
    fetch('/api/estimates/' + id).then(r => { if (!r.ok) throw new Error('견적서 없음'); return r.json(); }),
    fetch('/api/settings').then(r => r.json()),
  ]).then(([e, s]) => render(e, s))
    .catch(err => { document.getElementById('doc').innerHTML = '<p style="padding:20px;color:red">오류: ' + err.message + '</p>'; });
}

function fmt(n) { return (n == null || n === '') ? '' : Math.round(n).toLocaleString('ko-KR'); }

function render(e, s) {
  const date = e.estimate_date ? new Date(e.estimate_date) : new Date();
  const yyyy = date.getFullYear();
  const yy   = String(yyyy).slice(2);
  const mm   = String(date.getMonth() + 1).padStart(2, '0');
  const dd   = String(date.getDate()).padStart(2, '0');
  const issueDate = `${yyyy}. ${mm}. ${dd}`;
  const issueNo   = `${yy}-${mm}`;

  const items = e.items || [];
  const MIN_ROWS = 10;
  const padCount = Math.max(0, MIN_ROWS - items.length);

  const itemRows = items.map((item, i) => `
    <tr>
      <td class="text-center">${i + 1}</td>
      <td>${esc(item.model_name || '')}${ item.spec ? ' / ' + esc(item.spec) : '' }</td>
      <td class="text-center">식</td>
      <td class="text-center">${item.quantity || 1}</td>
      <td class="text-right">${fmt(item.unit_price)}</td>
      <td class="text-right">${fmt(item.amount)}</td>
      <td class="text-center">${esc(item.region || '')}</td>
    </tr>`).join('');

  const padRows = Array(padCount).fill(`
    <tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join('');

  document.getElementById('doc').innerHTML = `
    <div class="invoice-header">
      <div class="title-area">
        <h1>견 적 서</h1>
        <p>ESTIMATE / PROFORMA INVOICE</p>
      </div>
      <div class="meta-info">
        <div><strong>발행일자:</strong> ${issueDate}</div>
        <div><strong>발행번호:</strong> ${issueNo}</div>
      </div>
    </div>

    <div class="party-section">
      <div class="client-side">
        <div class="client-name">${esc(e.contractor_name || '')} 귀하</div>
        <div class="client-text">아래와 같이 견적서를 제출합니다.</div>
      </div>

      <div class="supplier-side">
        <table class="supplier-table">
          <colgroup>
            <col style="width:7%"><col style="width:21%"><col style="width:24%"><col style="width:18%"><col style="width:30%">
          </colgroup>
          <tr>
            <th rowspan="6">공<br>급<br>자</th>
            <th>등록번호</th>
            <td colspan="3">${esc(s.registration_number || '')}</td>
          </tr>
          <tr>
            <th>상호 (법인)</th>
            <td>${esc(s.company_name || '')}</td>
            <th>대표자</th>
            <td>${esc(s.owner_name || '')} (인)</td>
          </tr>
          <tr>
            <th>사업장 주소</th>
            <td colspan="3">${esc(s.address || '')}</td>
          </tr>
          <tr>
            <th>업태 / 종목</th>
            <td>${esc(s.business_type || '')}</td>
            <td>${esc(s.business_category || '')}</td>
            <td><strong>Tel:</strong> ${esc(s.phone || s.mobile || '')}</td>
          </tr>
          <tr>
            <th>계좌번호</th>
            <td colspan="3" class="bank-red">${esc(s.bank_account || '')}</td>
          </tr>
          <tr>
            <th>E-mail</th>
            <td colspan="3">${esc(s.email || '')}</td>
          </tr>
        </table>
      </div>
    </div>

    <div class="total-amount-bar">
      <span class="total-label">합계금액 (공급가액 + 부가세)</span>
      <span class="total-value">₩ ${fmt(e.total_amount)}</span>
    </div>

    <div class="section-title">1. 견적 명세표</div>
    <table class="item-table">
      <thead>
        <tr>
          <th style="width: 5.4%">NO</th>
          <th>품명 및 규격 (Description &amp; Specification)</th>
          <th style="width: 10%">단위</th>
          <th style="width: 8%">수량</th>
          <th style="width: 16%">단가</th>
          <th style="width: 18%">금액</th>
          <th style="width: 12%">비고</th>
        </tr>
      </thead>
      <tbody>
        ${itemRows}
        ${padRows}
        <tr class="summary-row">
          <td colspan="4" rowspan="3" style="background-color: #fff; border-bottom: none;"></td>
          <td class="label">소계 (Net)</td>
          <td class="text-right">${fmt(e.subtotal)}</td>
          <td></td>
        </tr>
        <tr class="summary-row">
          <td class="label">부가세 (VAT)</td>
          <td class="text-right">${fmt(e.vat_amount)}</td>
          <td></td>
        </tr>
        <tr class="summary-row">
          <td class="label" style="color: #000000;">총합계 (Total)</td>
          <td class="text-right" style="color: #000000; font-weight: 700;">${fmt(e.total_amount)}</td>
          <td></td>
        </tr>
      </tbody>
    </table>

    <div class="terms-section">
      <div class="terms-box">
        <div class="section-title">2. 견적 조건 (Terms)</div>
        <ul>
          <li><span>납기일자</span>: 협의 후 결정</li>
          <li><span>인도조건</span>: 도착도</li>
          <li><span>인도장소</span>: 지정 장소</li>
        </ul>
      </div>
      <div class="terms-box">
        <div class="section-title">3. 결제 및 기타 (Others)</div>
        <ul>
          <li><span>지급조건</span>: 현금 결제</li>
          <li><span>유효기간</span>: 견적일로부터 15일간</li>
          <li><span>포장조건</span>: 제조사 표준 포장</li>
        </ul>
      </div>
    </div>

    <div class="section-title" style="margin-top:20px">4. 특기사항 (Others)</div>
    <div class="memo-box">${esc(e.memo || '')}</div>
  `;

  document.title = '견적서 - ' + (e.contractor_name || '') + ' (' + issueDate + ')';
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
