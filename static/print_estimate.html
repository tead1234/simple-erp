<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>견적서</title>
  <style>
    @page { size: A4 portrait; margin: 12mm 14mm 16mm 14mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: '맑은 고딕', 'Malgun Gothic', Arial, sans-serif; font-size: 9.5pt; color: #000; background: #fff; }

    /* ── 인쇄 버튼 ── */
    .print-btn {
      position: fixed; top: 12px; right: 12px;
      padding: 8px 18px; background: #7c3aed; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 13px; z-index: 999;
    }
    @media print { .print-btn { display: none; } }

    /* ── 제목 ── */
    .doc-title { text-align: center; font-size: 21pt; font-weight: bold; letter-spacing: 5px; margin-bottom: 8px; }

    /* ── 발행정보 ── */
    .issue-info { text-align: right; font-size: 9pt; margin-bottom: 5px; }

    /* ── 헤더 (고객 박스 + 회사 박스) ── */
    .header { display: flex; gap: 10px; margin-bottom: 8px; align-items: stretch; }
    .customer-box {
      width: 38%; border: 2px solid #000; padding: 10px 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .customer-name { font-size: 15pt; font-weight: bold; }
    .company-box { flex: 1; border: 1px solid #000; }
    .company-tbl { width: 100%; border-collapse: collapse; }
    .company-tbl td { padding: 2px 6px; font-size: 9pt; vertical-align: middle; white-space: nowrap; }
    .company-tbl td:first-child { width: 72px; }
    .bank-red { color: #cc0000; font-weight: bold; }

    /* ── 안내문 ── */
    .subtitle { font-size: 9.5pt; margin-bottom: 6px; }

    /* ── 섹션 제목 ── */
    .section-title { font-size: 10pt; font-weight: bold; margin: 8px 0 3px; }
    .section-unit { float: right; font-size: 8.5pt; font-weight: normal; }

    /* ── 품목 테이블 ── */
    .items-table { width: 100%; border-collapse: collapse; }
    .items-table th, .items-table td {
      border: 1px solid #000; padding: 2px 4px;
      text-align: center; font-size: 9pt; vertical-align: middle;
    }
    .items-table thead th { background: #ececec; font-size: 8.5pt; line-height: 1.3; }
    .items-table tbody tr { height: 21px; }
    .items-table .name-col { text-align: left; padding-left: 6px; }
    .items-table .num-col  { text-align: right; padding-right: 5px; }
    .items-table .sum-label { font-weight: bold; text-align: center; }
    .items-table .sum-row td { background: #f8f8f8; }
    .items-table .total-row td { background: #f0f0f0; font-weight: bold; font-size: 10pt; }

    /* ── 견적조건 ── */
    .terms { margin-top: 10px; }
    .terms-title { font-size: 10pt; font-weight: bold; margin-bottom: 4px; }
    .terms-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 20px; font-size: 9pt; }

    /* ── 특기사항 ── */
    .others-box { border: 1px solid #000; min-height: 55px; padding: 5px 7px; font-size: 9pt; margin-top: 4px; white-space: pre-wrap; }
  </style>
</head>
<body>
<button class="print-btn" onclick="window.print()">🖨️ 인쇄</button>
<div id="doc"><p style="padding:30px;color:#888">데이터를 불러오는 중...</p></div>

<script>
const id = new URLSearchParams(location.search).get('id');
if (!id) {
  document.getElementById('doc').innerHTML = '<p style="padding:20px;color:red">URL에 견적서 ID가 없습니다. (?id=숫자)</p>';
} else {
  Promise.all([
    fetch('/api/estimates/' + id).then(r => { if (!r.ok) throw new Error('견적서 없음'); return r.json(); }),
    fetch('/api/settings').then(r => r.json()),
  ]).then(([e, s]) => render(e, s))
    .catch(err => { document.getElementById('doc').innerHTML = '<p style="padding:20px;color:red">오류: ' + err.message + '</p>'; });
}

function fmt(n) { return (n == null || n === '') ? '' : Math.round(n).toLocaleString('ko-KR'); }

function render(e, s) {
  const date = e.estimate_date ? new Date(e.estimate_date) : new Date();
  const yy  = String(date.getFullYear()).slice(2);
  const mm  = String(date.getMonth() + 1).padStart(2, '0');
  const dd  = String(date.getDate()).padStart(2, '0');
  const issueDate = `${yy}.${mm}.${dd}`;
  const issueNo   = `${yy}-${mm}`;

  const items = e.items || [];
  const MIN_ROWS = 10;
  const padCount = Math.max(0, MIN_ROWS - items.length);

  const itemRows = items.map((item, i) => `
    <tr>
      <td>${i + 1}</td>
      <td class="name-col">${esc(item.model_name || '')}${ item.spec ? ' / ' + esc(item.spec) : '' }</td>
      <td>식</td>
      <td>${item.quantity || 1}</td>
      <td class="num-col">${fmt(item.unit_price)}</td>
      <td class="num-col">${fmt(item.amount)}</td>
      <td class="name-col">${esc(item.region || '')}</td>
    </tr>`).join('');

  const padRows = Array(padCount).fill(`
    <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join('');

  document.getElementById('doc').innerHTML = `
    <div class="doc-title">견적서 / ESTIMATE</div>

    <div class="issue-info">발행일자: ${issueDate}&nbsp;&nbsp;&nbsp;&nbsp;발행번호: ${issueNo}</div>

    <div class="header">
      <div class="customer-box">
        <div class="customer-name">${esc(e.contractor_name || '')} &nbsp;귀하</div>
      </div>
      <div class="company-box">
        <table class="company-tbl">
          <tr><td>사업자 번호</td><td>: ${esc(s.registration_number || '')}</td></tr>
          <tr><td>상 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 호</td><td>: ${esc(s.company_name || '')}</td></tr>
          <tr><td>주 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 소</td><td>: ${esc(s.address || '')}</td></tr>
          <tr><td>T E L</td><td>: ${esc(s.phone || '')}</td></tr>
          <tr><td>C . P</td><td>: ${esc(s.mobile || '')}</td></tr>
          <tr><td>계 좌 번 호</td><td>: <span class="bank-red">${esc(s.bank_account || '')}</span></td></tr>
          <tr><td>E - m a i l</td><td>: ${esc(s.email || '')}</td></tr>
          <tr><td style="padding-top:5px">대 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 표</td>
              <td style="padding-top:5px">: ${esc(s.owner_name || '')}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(인)</td></tr>
        </table>
      </div>
    </div>

    <p class="subtitle">다음과 같이 견적서를 제출합니다.</p>

    <div class="section-title">1. 거래명세표 <span class="section-unit">(단위:원)</span></div>
    <table class="items-table">
      <thead>
        <tr>
          <th style="width:5%">NO</th>
          <th style="width:36%">품 명 . 규 격<br><small>DESCRITION &amp; SPEC'</small></th>
          <th style="width:6%">단위<br><small>UNIT</small></th>
          <th style="width:6%">수량<br><small>Q'TY</small></th>
          <th style="width:15%">단 &nbsp;&nbsp; 가<br><small>UNIT PRICE</small></th>
          <th style="width:15%">금 &nbsp;&nbsp; 액<br><small>AMOUNT</small></th>
          <th style="width:17%">비 &nbsp;&nbsp; 고<br><small>REMARKS</small></th>
        </tr>
      </thead>
      <tbody>
        ${itemRows}
        ${padRows}
        <tr class="sum-row">
          <td colspan="4"></td>
          <td class="sum-label">소 &nbsp;&nbsp;&nbsp; 계</td>
          <td class="num-col">${fmt(e.subtotal)}</td>
          <td></td>
        </tr>
        <tr class="sum-row">
          <td colspan="4"></td>
          <td class="sum-label">부 &nbsp;&nbsp; 가 &nbsp;&nbsp; 세</td>
          <td class="num-col">${fmt(e.vat_amount)}</td>
          <td></td>
        </tr>
        <tr class="total-row">
          <td colspan="4"></td>
          <td class="sum-label">합 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 계</td>
          <td class="num-col">${fmt(e.total_amount)}</td>
          <td></td>
        </tr>
      </tbody>
    </table>

    <div class="terms">
      <div class="terms-title">2. 견적조건 / TERMS &amp; CONDITION</div>
      <div class="terms-grid">
        <div>2-1. 납 &nbsp; 기 : 협의후 결정</div>
        <div>2-4. 지급조건 :</div>
        <div>2-2. 인도조건 : 도착도</div>
        <div>2-5. 유효기간 : 견적일로부터 15일</div>
        <div>2-3. 인도장소 :</div>
        <div>2-6. 포장조건 : 제조자 표준포장</div>
      </div>
    </div>

    <div class="terms">
      <div class="terms-title">3. 특기사항 / OTHERS</div>
      <div class="others-box">${esc(e.memo || '')}</div>
    </div>
  `;

  document.title = '견적서 - ' + (e.contractor_name || '') + ' (' + issueDate + ')';
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
