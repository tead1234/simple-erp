<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>정비내역서</title>
  <style>
    @page { size: A4 portrait; margin: 12mm 14mm 16mm 14mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }

    body { background-color: #f8fafc; padding: 40px 20px; display: flex; justify-content: center; color: #334155; }

    .print-btn {
      position: fixed; top: 12px; right: 12px;
      padding: 8px 18px; background: #7c3aed; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 13px; z-index: 999;
    }
    @media print { .print-btn { display: none; } }

    .invoice-container {
      width: 840px; min-height: 1188px; background-color: #ffffff;
      padding: 50px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border-radius: 8px; position: relative;
    }

    .invoice-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 20px; border-bottom: 4px solid #000000; padding-bottom: 10px;
    }
    .title-area h1 { font-size: 24px; color: #000000; letter-spacing: 2px; margin-bottom: 4px; }
    .title-area p { font-size: 12px; color: #64748b; }
    .meta-info { text-align: right; font-size: 12px; color: #475569; line-height: 1.4; }

    .party-section { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 10px; }
    .client-side { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 5px; }
    .client-name { font-size: 17px; font-weight: 700; border-bottom: 4px solid #64748b; padding-bottom: 5px; margin-bottom: 6px; }
    .client-text { font-size: 13px; color: #475569; }

    .supplier-side { width: 480px; }
    .supplier-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    .supplier-table th {
      background-color: #f1f5f9; color: #000000; font-weight: 600;
      text-align: center; padding: 4px 8px; border: 2px solid #cbd5e1;
    }
    .supplier-table td { padding: 4px 8px; border: 2px solid #cbd5e1; color: #334155; word-break: keep-all; }
    .bank-red { color: #cc0000; font-weight: bold; font-size: 14px; }

    .total-amount-bar {
      background-color: #f1f5f9; border: 2px solid #cbd5e1; padding: 8px 20px;
      border-radius: 6px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
    }
    .total-label { font-size: 14px; font-weight: 600; color: #000000; }
    .total-value { font-size: 20px; font-weight: 700; color: #000000; }

    .section-title { font-size: 15px; font-weight: 700; color: #000000; margin-bottom: 6px; }

    .info-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 12px; }
    .info-table th {
      background-color: #f1f5f9; color: #000000; font-weight: 600;
      text-align: center; padding: 4px 8px; border: 2px solid #cbd5e1; width: 100px;
    }
    .info-table td { padding: 4px 8px; border: 2px solid #cbd5e1; color: #334155; }

    .item-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 13px; }
    .item-table th { background-color: #000000; color: #ffffff; font-weight: 500; padding: 6px; border: 2px solid #000000; }
    .item-table td { padding: 5px 10px; border-bottom: 2px solid #e2e8f0; color: #334155; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }

    .summary-row td { font-weight: 600; background-color: #f8fafc; border-bottom: 2px solid #cbd5e1; }
    .summary-row .label { text-align: right; color: #475569; }

    .memo-box {
      border: 2px solid #e2e8f0; border-radius: 6px;
      padding: 10px; background-color: #f8fafc; min-height: 40px;
      font-size: 12px; color: #475569; white-space: pre-wrap; margin-bottom: 15px;
    }

    .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .photo-grid img {
      width: 100%; height: 260px; object-fit: cover; border-radius: 6px; border: 2px solid #e2e8f0;
    }

    @media print {
      body { background-color: #ffffff; padding: 0; }
      .invoice-container { box-shadow: none; padding: 0; width: 100%; }
    }
  </style>
</head>
<body>
<button class="print-btn" onclick="window.print()">🖨️ 인쇄</button>
<div class="invoice-container" id="doc"><p style="padding:30px;color:#888">데이터를 불러오는 중...</p></div>

<script>
const id = new URLSearchParams(location.search).get('id');
if (!id) {
  document.getElementById('doc').innerHTML = '<p style="padding:20px;color:red">URL에 정비 ID가 없습니다. (?id=숫자)</p>';
} else {
  Promise.all([
    fetch('/api/maintenance/' + id).then(r => { if (!r.ok) throw new Error('정비 내역 없음'); return r.json(); }),
    fetch('/api/settings').then(r => r.json()),
  ]).then(([m, s]) => render(m, s))
    .catch(err => { document.getElementById('doc').innerHTML = '<p style="padding:20px;color:red">오류: ' + err.message + '</p>'; });
}

function fmt(n) { return (n == null || n === '') ? '' : Math.round(n).toLocaleString('ko-KR'); }
function fmtDate(v) { return v ? v.slice(0, 10) : ''; }

function render(m, s) {
  const issueDate = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });

  const parts = m.parts || [];
  const partRows = parts.length
    ? parts.map((p, i) => `
      <tr>
        <td class="text-center">${i + 1}</td>
        <td>${esc(p.part_name || '')}</td>
        <td class="text-center">${p.quantity}</td>
        <td class="text-right">${fmt(p.unit_price)}</td>
        <td class="text-right">${fmt(p.amount)}</td>
      </tr>`).join('')
    : `<tr><td colspan="5" class="text-center" style="color:#94a3b8;padding:16px">사용 부품 없음</td></tr>`;

  const photos = (m.photos || []).slice(0, 4);
  const photoSection = photos.length
    ? `<div class="section-title">4. 수리 사진</div>
       <div class="photo-grid">
         ${photos.map(p => `<img src="/api/maintenance/${m.id}/photos/${p.id}">`).join('')}
       </div>`
    : '';

  document.getElementById('doc').innerHTML = `
    <div class="invoice-header">
      <div class="title-area">
        <h1>정 비 내 역 서</h1>
        <p>MAINTENANCE SERVICE RECORD</p>
      </div>
      <div class="meta-info">
        <div><strong>발행일자:</strong> ${issueDate}</div>
        <div><strong>정비번호:</strong> #${m.id}</div>
      </div>
    </div>

    <div class="party-section">
      <div class="client-side">
        <div class="client-name">${esc(m.customer_name || '')} 귀하</div>
        <div class="client-text">아래와 같이 정비내역을 안내드립니다.</div>
      </div>

      <div class="supplier-side">
        <table class="supplier-table">
          <colgroup>
            <col style="width:7%"><col style="width:21%"><col style="width:24%"><col style="width:18%"><col style="width:30%">
          </colgroup>
          <tr>
            <th rowspan="6">공<br>급<br>자</th>
            <th>등록번호</th>
            <td colspan="3">${esc(s.registration_number || '')}</td>
          </tr>
          <tr>
            <th>상호 (법인)</th>
            <td>${esc(s.company_name || '')}</td>
            <th>대표자</th>
            <td>${esc(s.owner_name || '')} (인)</td>
          </tr>
          <tr>
            <th>사업장 주소</th>
            <td colspan="3">${esc(s.address || '')}</td>
          </tr>
          <tr>
            <th>업태 / 종목</th>
            <td>${esc(s.business_type || '')}</td>
            <td>${esc(s.business_category || '')}</td>
            <td><strong>Tel:</strong> ${esc(s.phone || s.mobile || '')}</td>
          </tr>
          <tr>
            <th>계좌번호</th>
            <td colspan="3" class="bank-red">${esc(s.bank_account || '')}</td>
          </tr>
          <tr>
            <th>E-mail</th>
            <td colspan="3">${esc(s.email || '')}</td>
          </tr>
        </table>
      </div>
    </div>

    <div class="total-amount-bar">
      <span class="total-label">수리금액</span>
      <span class="total-value">₩ ${fmt(m.total_amount)}</span>
    </div>

    <div class="section-title">1. 정비 정보</div>
    <table class="info-table">
      <tr>
        <th>기종</th><td>${esc(m.machine_type || '')}</td>
        <th>기계번호</th><td>${esc(m.machine_number || '')}</td>
      </tr>
      <tr>
        <th>접수일</th><td>${fmtDate(m.received_date)}</td>
        <th>완료일</th><td>${fmtDate(m.completed_date)}</td>
      </tr>
      <tr>
        <th>증상</th><td colspan="3">${esc(m.symptom || '')}</td>
      </tr>
    </table>

    <div class="section-title">2. 작업내용</div>
    <div class="memo-box">${esc(m.description || '')}</div>

    <div class="section-title">3. 사용 부품 및 수리금액</div>
    <table class="item-table">
      <thead>
        <tr>
          <th style="width: 8%">NO</th>
          <th>품명</th>
          <th style="width: 12%">수량</th>
          <th style="width: 20%">단가</th>
          <th style="width: 20%">금액</th>
        </tr>
      </thead>
      <tbody>
        ${partRows}
        <tr class="summary-row">
          <td colspan="3" style="background-color: #fff; border-bottom: none;"></td>
          <td class="label" style="color: #000000;">총 수리금액</td>
          <td class="text-right" style="color: #000000; font-weight: 700;">${fmt(m.total_amount)}</td>
        </tr>
      </tbody>
    </table>

    ${photoSection}
  `;

  document.title = '정비내역서 - ' + (m.customer_name || '') + ' (' + issueDate + ')';
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
